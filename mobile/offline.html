<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #6b6b6b;
        --button-bg: #1a1a1a;
        --button-fg: #ffffff;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141414;
          --fg: #f5f5f5;
          --muted: #a3a3a3;
          --button-bg: #f5f5f5;
          --button-fg: #141414;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      svg { width: 64px; height: 64px; color: var(--fg); margin-bottom: 8px; }
      h1 { margin: 0; font-size: 22px; }
      p { margin: 0; max-width: 300px; color: var(--muted); line-height: 1.5; }
      button {
        margin-top: 12px;
        padding: 12px 28px;
        border: 0;
        border-radius: 999px;
        background: var(--button-bg);
        color: var(--button-fg);
        font: inherit;
        font-weight: 600;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.45">
        <line x1="16" y1="16" x2="6" y2="7.5" />
        <line x1="16" y1="16" x2="26.5" y2="9" />
        <line x1="16" y1="16" x2="22" y2="27" />
      </g>
      <path d="M6 7.5 Q 10 22 22 27" fill="none" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" />
      <circle cx="6" cy="7.5" r="3.2" fill="#9e77ed" />
      <circle cx="26.5" cy="9" r="3.6" fill="#0ea5e9" />
      <circle cx="22" cy="27" r="3" fill="#f43f5e" />
      <circle cx="16" cy="16" r="6.5" fill="currentColor" />
    </svg>
    <h1>You’re offline</h1>
    <p>Your charts are saved to your account, so they need a connection. Check your signal or Wi‑Fi and try again.</p>
    <button type="button" id="retry">Try again</button>
    <script>
      // Capacitor serves this page from inside the app; going back to the
      // site's address retries the connection.
      document.getElementById("retry").addEventListener("click", () => {
        window.location.href = "https://mind-web-chart.vercel.app/charts";
      });
    </script>
  </body>
</html>
